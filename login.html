<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MEO Energia Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #00c24f 0%, #009938 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      background: white;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
      padding: 40px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header h1 {
      font-size: 28px;
      color: #333;
      margin-bottom: 8px;
    }

    .login-header p {
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #333;
      font-size: 14px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #00c24f;
      box-shadow: 0 0 0 3px rgba(0, 194, 79, 0.1);
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: #00c24f;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-login:hover {
      background: #009938;
    }

    .btn-login:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .error-message {
      display: none;
      padding: 12px;
      margin-bottom: 20px;
      background: #fee;
      border: 1px solid #fcc;
      border-radius: 4px;
      color: #c33;
      font-size: 14px;
      animation: slideIn 0.3s ease;
    }

    .error-message.show {
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
      font-size: 14px;
      color: #666;
      margin-top: 10px;
    }

    .loading.show {
      display: block;
    }

    .info-box {
      margin-top: 20px;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 4px;
      font-size: 12px;
      color: #666;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1>MEO Energia</h1>
      <p>Demo - Acesso restrito</p>
    </div>

    <form id="loginForm">
      <div class="error-message" id="errorMessage"></div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="seu.email@alticelabs.com"
          required
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="btn-login" id="submitBtn">
        Entrar
      </button>

      <div class="loading" id="loading">
        A autenticar...
      </div>
    </form>

    <div class="info-box">
      <strong>Demo restrita:</strong> Apenas colaboradores da Altice Labs com domínio
      @alticelabs.com têm acesso.
    </div>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const errorMessage = document.getElementById("errorMessage");
    const loading = document.getElementById("loading");
    const submitBtn = document.getElementById("submitBtn");

    // Extrair redirect URL dos parâmetros
    const urlParams = new URLSearchParams(window.location.search);
    const redirect = urlParams.get("redirect") || "/";

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      console.log("[FORM] Tentativa de login");
      console.log("[FORM] Email:", email);
      console.log("[FORM] Password:", password ? "***" : "VAZIA");
      console.log("[FORM] Redirect:", redirect);

      errorMessage.classList.remove("show");
      submitBtn.disabled = true;
      loading.classList.add("show");

      try {
        console.log("[FETCH] A fazer POST para /.netlify/functions/login");
        const payload = { email, password, redirect };
        console.log("[FETCH] Payload:", JSON.stringify(payload));

        const response = await fetch("/.netlify/functions/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        console.log("[RESPONSE] Status:", response.status);
        console.log("[RESPONSE] Status Text:", response.statusText);
        console.log("[RESPONSE] Headers:", response.headers);

        const data = await response.json();
        console.log("[RESPONSE] Data:", data);

        if (!response.ok) {
          throw new Error(data.error || "Autenticação falhou");
        }

        // Login bem-sucedido - redirecionar
        window.location.href = data.redirect;
      } catch (error) {
        console.error("[FATAL]", error);
        errorMessage.textContent =
          error.message || "Erro na autenticação. Tente novamente.";
        errorMessage.classList.add("show");
        submitBtn.disabled = false;
        loading.classList.remove("show");
      }
    });
  </script>
</body>
</html>
